<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${CSP_SOURCE} 'unsafe-inline'; script-src ${CSP_SOURCE};"
    />
    <link rel="stylesheet" href="${CSS_URI}" />
    <title>Boundary Tests</title>
  </head>
  <body>
    <header>
      <h1 id="title">Boundary Tests</h1>
      <p id="subtitle"></p>
    </header>
    <main>
      <section class="source-pane" aria-label="Source">
        <div class="pane-header">
          <span class="pane-title" id="source-filename"></span>
        </div>
        <div class="source-scroll">
          <table class="source-table" id="source-table">
            <tbody id="source-body"></tbody>
          </table>
        </div>
      </section>
      <section class="inputs-pane" aria-label="Inputs">
        <div class="named-section" id="named-section">
          <div class="named-header">
            <button
              type="button"
              id="named-toggle"
              class="named-toggle"
              aria-expanded="true"
              title="Show / hide named ranges"
            >
              <span class="caret">▾</span>
              <span class="pane-title">Named ranges</span>
              <span id="named-count" class="row-count-pill"></span>
            </button>
            <button
              type="button"
              id="named-add"
              class="secondary named-add"
              title="Define a new named range"
            >+ Add</button>
          </div>
          <div class="named-body" id="named-body">
            <table class="named-table" id="named-table">
              <tbody id="named-tbody"></tbody>
            </table>
            <p id="named-empty" class="named-empty-msg">
              No named ranges yet. Click <strong>+ Add</strong> to define
              one (e.g. <code>fast = [30, 120]</code>).
            </p>
          </div>
        </div>
        <div class="pane-header">
          <span class="pane-title">Inputs</span>
          <span id="row-count" class="row-count-pill"></span>
          <label class="details-toggle">
            <input type="checkbox" id="toggle-details" />
            Show details
          </label>
        </div>
        <div class="inputs-scroll">
          <table id="rows-table">
            <thead>
              <tr>
                <th>Scope</th>
                <th>Routine</th>
                <th>Expression</th>
                <th>Type</th>
                <th class="col-annotation">Annotation</th>
                <th>Mode</th>
                <th>Value</th>
                <th title="Skip ±1 boundary adjustment for this input">Skip ±1</th>
                <th
                  title="Predicted boundary values pyatg will emit. Hover a modified row for the autogen default."
                >Generates</th>
              </tr>
            </thead>
            <tbody id="rows-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer>
      <span id="footer-toast" class="footer-toast" aria-live="polite"></span>
      <button id="btn-cancel" class="secondary" type="button">Cancel</button>
      <button
        id="btn-save-draft"
        class="secondary"
        type="button"
        title="Save current edits to .bp-sheets/overrides.json without generating tests"
      >Save draft</button>
      <button id="btn-generate" class="primary" type="button">
        Generate Tests
      </button>
    </footer>
    <script id="payload" type="application/json">${PAYLOAD}</script>
    <script src="${JS_URI}"></script>
  </body>
</html>
