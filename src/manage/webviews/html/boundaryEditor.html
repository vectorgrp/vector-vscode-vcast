<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${CSP_SOURCE} 'unsafe-inline'; script-src ${CSP_SOURCE};"
    />
    <link rel="stylesheet" href="${CSS_URI}" />
    <title>Boundary Tests</title>
  </head>
  <body>
    <header>
      <h1 id="title">Boundary Tests</h1>
      <p id="subtitle"></p>
    </header>
    <main>
      <section class="source-pane" aria-label="Source">
        <div class="pane-header">
          <span class="pane-title" id="source-filename"></span>
        </div>
        <div class="source-scroll">
          <table class="source-table" id="source-table">
            <tbody id="source-body"></tbody>
          </table>
        </div>
      </section>
      <section class="inputs-pane" aria-label="Inputs">
        <div class="tab-bar" role="tablist">
          <button
            type="button"
            class="tab-btn active"
            id="tab-inputs"
            role="tab"
            aria-selected="true"
          >Inputs <span id="row-count" class="tab-pill"></span></button>
          <button
            type="button"
            class="tab-btn"
            id="tab-named"
            role="tab"
            aria-selected="false"
          >Named ranges <span id="named-count" class="tab-pill"></span></button>
        </div>
        <div
          class="tab-pane active"
          id="pane-inputs"
          role="tabpanel"
          aria-labelledby="tab-inputs"
        >
        <div class="inputs-scroll">
          <table id="rows-table">
            <thead>
              <tr>
                <th title="Where pyatg sees this input: a routine name for parameters, 'global' for globals, 'stub' for stub returns.">Scope</th>
                <th title="The routine that uses this input.">Routine</th>
                <th title="The user-facing expression for the input — e.g. 'x', 'pt.y', 'arr[*]'. Click the matching identifier in the source pane to jump here.">Expression</th>
                <th title="C type. Shows the typedef name (e.g. int8_t) when applicable, with the underlying primitive on hover.">Type</th>
                <th title="Override mode. Auto = pyatg picks type-extreme values; Fixed = one value; Range = [lo, hi]; Named = a defined range; Literal = pick an enum literal.">Mode</th>
                <th title="The override value(s) for the chosen mode.">Value</th>
                <th title="Skip ±1 boundary adjustment for this input.">Skip ±1</th>
                <th title="Predicted boundary values pyatg will emit.">Generates</th>
              </tr>
            </thead>
            <tbody id="rows-body"></tbody>
          </table>
        </div>
        </div><!-- /pane-inputs -->

        <div
          class="tab-pane"
          id="pane-named"
          role="tabpanel"
          aria-labelledby="tab-named"
        >
          <div class="pane-header named-pane-header">
            <span class="pane-title">Named ranges</span>
            <button
              type="button"
              id="named-add"
              class="primary named-add"
              title="Define a new named range"
            >+ Add named range</button>
          </div>
          <div class="named-body" id="named-body">
            <div id="named-list"></div>
            <p id="named-empty" class="named-empty-msg">
              No named ranges yet. Click <strong>+ Add named range</strong>
              to define one (e.g. <code>fast</code> containing
              <code>[30, 120]</code>).
            </p>
          </div>
        </div><!-- /pane-named -->
      </section>
    </main>
    <footer>
      <span id="footer-toast" class="footer-toast" aria-live="polite"></span>
      <button id="btn-cancel" class="secondary" type="button">Cancel</button>
      <button
        id="btn-save-draft"
        class="secondary"
        type="button"
        title="Save current edits to .bp-sheets/overrides.json without generating tests"
      >Save</button>
      <button id="btn-generate" class="primary" type="button">
        Generate Tests
      </button>
    </footer>
    <script id="payload" type="application/json">${PAYLOAD}</script>
    <script src="${JS_URI}"></script>
  </body>
</html>
