<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Create New CFG File</title>
  <link rel="stylesheet" href="{{ cssUri }}" />
</head>
<body>
  <div class="modal">
    <h2>Create New CFG File</h2>

    <label for="targetDirInput">Output Folder:</label>
    <div class="single-input-container">
      <input type="text" id="targetDirInput" aria-label="Output Folder" placeholder="Select a folder…" readonly />
      <button id="btnBrowse" class="select-button">Browse…</button>
    </div>

    <label for="languageSelect">Language:</label>
    <div class="single-input-container">
      <select id="languageSelect" aria-label="Language">
        <option value="c" selected>C / C++</option>
        <option value="ada">Ada (GNAT, host)</option>
      </select>
    </div>

    <div id="compilerSection">
      <label for="compilerInput">Select Compiler:</label>
      <div class="autocomplete">
        <input type="text" id="compilerInput" aria-label="Compiler Name Input" placeholder="Type or click to select…" autocomplete="off" />
        <ul id="suggestions" class="suggestions"></ul>
      </div>
    </div>

    <p id="adaNote" style="display: none; font-size: 12px; color: #888;">
      Only GNAT on the host is supported for Ada. A minimal ADACAST_.CFG
      (COMPILATION_SYSTEM: GNAT, TARGET_VARIANT: HOST) will be created.
    </p>

    <div class="options-section">
      <h3>Additional Options:</h3>

      <div class="option-row" id="codedTestsRow">
        <label class="toggle-label" for="enableCodedTests">Enable Coded Tests</label>
        <label class="vscode-toggle" for="enableCodedTests">
          <span class="toggle-switch">
            <input type="checkbox" id="enableCodedTests" />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <div class="option-row">
        <label class="toggle-label" for="defaultCFG">Set as Default Configuration File</label>
        <label class="vscode-toggle" for="defaultCFG">
          <span class="toggle-switch">
            <input type="checkbox" id="defaultCFG" />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <div class="option-row" id="dbOptionRow" style="display: none;">
        <label class="toggle-label" for="useDefaultDB">
          Use Default VCDB
          <br><small id="dbPathLabel" style="font-size: 11px; color: #888;"></small>
        </label>
        <label class="vscode-toggle" for="useDefaultDB">
          <span class="toggle-switch">
            <input type="checkbox" id="useDefaultDB" />
            <span class="slider"></span>
          </span>
        </label>
      </div>
    </div>

    <div class="button-container">
      <button id="btnCancel" class="cancel-button">Cancel</button>
      <button id="btnSubmit" class="primary-button">Create</button>
    </div>
  </div>

  <!-- injected by extension -->
  {{ compilerDataScript }}

  <script src="{{ scriptUri }}"></script>
</body>
</html>
